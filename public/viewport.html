<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTC · Viewport Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a1310;color:#f4efe6;font:14px system-ui,Arial,sans-serif}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:12px 18px;background:#172a23;border-bottom:1px solid #806743}.brand{font:22px Georgia,serif;color:#e5b869}.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}button,.link{background:#20382e;color:#eee2cc;border:1px solid #6a785e;border-radius:8px;padding:9px 13px;cursor:pointer;text-decoration:none;font:inherit}button.active{background:#e5b869;color:#13231b;border-color:#e5b869}button:hover,.link:hover{filter:brightness(1.15)}.details{color:#b5c8b8;font-size:12px}.stage{height:calc(100dvh - 66px);min-height:400px;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:22px;background:radial-gradient(ellipse at center,#243a30,#0a1310)}.frame{width:100%;height:100%;max-width:100%;background:#0a1310;border:2px solid #ad8c55;border-radius:12px;overflow:hidden;box-shadow:0 22px 70px #000b;flex-shrink:0;transition:width .2s,height .2s}.frame iframe{display:block;width:100%;height:100%;border:0;background:#0a1310}.stage[data-mode="mobile"] .frame{width:390px;height:844px}.stage[data-mode="tablet"] .frame{width:820px;height:1180px}.stage[data-mode="desktop"] .frame{width:1440px;height:900px}.stage[data-mode="auto"] .frame{width:100%;height:100%;border-radius:0}@media(max-width:700px){.stage{padding:8px;height:calc(100dvh - 110px)}.toolbar{padding:9px}.brand{font-size:17px}.controls{gap:4px}button,.link{padding:7px 9px;font-size:12px}} 
</style></head><body><header class="toolbar"><div class="brand">PAY THE COST <span class="details">/ Viewport Studio</span></div><div class="controls"><button data-mode="auto" class="active">Auto</button><button data-mode="desktop">Desktop</button><button data-mode="tablet">Tablet</button><button data-mode="mobile">Mobile</button><span id="dimensions" class="details"></span><a class="link" href="/" target="_blank" rel="noopener">Open Game ↗</a></div></header><main class="stage" id="stage" data-mode="auto"><div class="frame" id="frame"><iframe title="Pay the Cost game preview" src="/"></iframe></div></main><script>
const stage=document.getElementById('stage'),frame=document.getElementById('frame'),label=document.getElementById('dimensions');
function update(){label.textContent=Math.round(frame.clientWidth)+' × '+Math.round(frame.clientHeight)}
document.querySelectorAll('button[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{stage.dataset.mode=btn.dataset.mode;document.querySelectorAll('button[data-mode]').forEach(b=>b.classList.toggle('active',b===btn));update()}));
new ResizeObserver(update).observe(frame);update();
</script></body></html>
